name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - name: Install wheel and test dependencies
        run: |
          python -m pip install dist/*.whl
          python -m pip install -r tests-unit/requirements.txt
      - name: Verify standalone imports
        run: |
          if ! python -c "import dinkster_comfy.cli_args as c; c.args.cpu = True; import dinkster_comfy.sd, dinkster_comfy.samplers, dinkster_comfy.model_management" 2>import-error.log; then
            message=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' import-error.log)
            echo "::error title=Standalone import failed::$message"
            exit 1
          fi
      - name: Run retained library tests
        run: python -m pytest -q tests-unit/comfy_test tests-unit/comfy_quant tests-unit/deploy_environment_test.py
